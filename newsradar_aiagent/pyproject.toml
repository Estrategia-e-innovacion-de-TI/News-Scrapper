[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsradar-aiagent"
version = "0.1.0"
description = "News Radar AI Agent — conversational chat for ARAS and Riesgos Emergentes queries"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "News Radar Team"}]
dependencies = [
    "boto3>=1.34.0",
    "mcp>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["newsradar_agent*"]
