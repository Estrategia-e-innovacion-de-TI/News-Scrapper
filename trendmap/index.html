<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Radar — Trend Intelligence Report</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#21262d;--text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149;--purple:#bc8cff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.header{padding:24px;border-bottom:1px solid var(--border)}
.header h1{font-size:1.4em;color:#fff}
.subtitle{color:var(--muted);font-size:.85em;margin-top:4px}
.stats-bar{display:flex;gap:20px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.stat{text-align:center;min-width:70px}.stat .v{font-size:1.2em;font-weight:700;color:var(--accent)}.stat .l{font-size:.7em;color:var(--muted)}
.tabs{display:flex;gap:0;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.tab{padding:10px 16px;cursor:pointer;font-size:.83em;color:var(--muted);border-bottom:2px solid transparent;transition:.2s}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.main{display:flex;min-height:calc(100vh - 200px)}
.chart-area{flex:1;padding:16px;overflow-y:auto}
.sidebar{width:340px;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:14px;font-size:.85em}
.sidebar h3{color:#fff;font-size:.9em;margin-bottom:10px}
.filter-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter-btn{padding:4px 10px;border-radius:12px;font-size:.75em;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:.2s}
.filter-btn:hover,.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-btn.type-news.active{background:#3fb950;border-color:#3fb950}.filter-btn.type-paper.active{background:#bc8cff;border-color:#bc8cff}
.cl-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;cursor:pointer;transition:.15s}
.cl-card:hover,.cl-card.sel{border-color:var(--accent);background:#1c2128}
.cl-card .nm{font-weight:600;font-size:.85em}.cl-card .mt{color:var(--muted);font-size:.72em;margin-top:3px}
.cl-card .tg{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.cl-card .tg span{background:var(--border);color:var(--accent);padding:1px 7px;border-radius:8px;font-size:.68em}
.badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:.68em;font-weight:600}
.b-alta{background:#1a4731;color:var(--green)}.b-media{background:#3d2e00;color:var(--yellow)}.b-baja{background:#3d1a1a;color:var(--red)}
.info-panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin:16px 24px;font-size:.82em}
.info-panel h3{color:var(--accent);font-size:.9em;margin-bottom:8px}
.info-panel li{margin:4px 0}.info-panel li::before{content:"→ ";color:var(--accent)}
.risk li{color:var(--red)}.risk li::before{content:"⚠️ "}
.method-box{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;margin:12px 0;font-size:.78em;color:var(--muted)}
.method-box dt{color:var(--accent);font-weight:600;margin-top:6px}.method-box dd{margin-left:12px}
table{width:100%;border-collapse:collapse;font-size:.8em}
th{background:var(--surface);color:var(--accent);padding:8px;text-align:left;position:sticky;top:0;z-index:1}
td{padding:6px 8px;border-bottom:1px solid var(--border)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.footer{padding:14px 24px;border-top:1px solid var(--border);color:var(--muted);font-size:.72em;text-align:center}
#chart{width:100%;min-height:500px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px}
.card h4{color:#fff;font-size:.88em;margin-bottom:6px}
.kpi{font-size:1.8em;font-weight:700;color:var(--accent)}
.kpi-label{font-size:.72em;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script>
let D=null,view='overview',selCluster=null,selCategory=null,showNews=true,showPapers=true;
const C=['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#39d2c0','#ff7b72','#79c0ff','#d2a8ff','#ffa657'];
const CAT_COLORS={'Ciberseguridad':'#f85149','Inteligencia Artificial':'#58a6ff','Blockchain/Cripto':'#d29922',
'Fintech/Banca Digital':'#3fb950','Cloud/Datos':'#bc8cff','Regulación':'#ff7b72','Computación Cuántica':'#39d2c0',
'Innovación General':'#ffa657','Otros':'#8b949e'};

async function boot(){try{D=await(await fetch('data/trendmap.json')).json();render()}catch(e){document.getElementById('app').innerHTML='<p style="padding:40px;color:var(--red)">Error: run build_trendmap.py first</p>'}}

function render(){
document.getElementById('app').innerHTML=headerHTML()+navHTML()+'<div class="main"><div class="chart-area"><div id="chart"></div></div>'+sidebarHTML()+'</div>'+insightsHTML()+footerHTML();
setupEvents();renderView()}

function headerHTML(){
const m=D.meta,sc=m.source_counts||{},dr=m.date_range||{};
return`<div class="header"><h1>📡 Trend Intelligence Report</h1>
<span class="subtitle">Vigilancia Tecnológica · ${(dr.min||'?').slice(0,10)} → ${(dr.max||'?').slice(0,10)}</span></div>
<div class="stats-bar">
${sb(sc.news||0,'📰 Noticias')}${sb(sc.papers||0,'📄 Papers')}${sb(D.articles.length,'Filtrados')}
${sb(D.clusters.length,'Clusters')}${sb((D.super_clusters||[]).length,'Categorías')}
${sb(m.config?.silhouette_score||'?','Silhouette')}
${sb((m.generated_at_utc||'').slice(0,16).replace('T',' '),'Generado UTC')}</div>`}
function sb(v,l){return`<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`}

function navHTML(){
const t=[['overview','📊 Resumen'],['embedding','🗺️ Mapa'],['impact','📈 Impacto'],['hype','🔄 Hype'],['table','📋 Detalle'],['method','ⓘ Metodología']];
return`<div class="tabs">${t.map(([k,l])=>`<div class="tab${view===k?' active':''}" data-v="${k}">${l}</div>`).join('')}</div>`}

function sidebarHTML(){
return`<div class="sidebar"><h3>Filtros</h3>
<div class="filter-row">
<button class="filter-btn type-news${showNews?' active':''}" data-ft="news">📰 Noticias</button>
<button class="filter-btn type-paper${showPapers?' active':''}" data-ft="paper">📄 Papers</button></div>
<h3>Categorías</h3><div class="filter-row">
<button class="filter-btn${!selCategory?' active':''}" data-cat="">Todas</button>
${(D.super_clusters||[]).map(sc=>`<button class="filter-btn${selCategory===sc.category?' active':''}" data-cat="${sc.category}" style="border-color:${CAT_COLORS[sc.category]||'var(--muted)'}">${sc.category} (${sc.item_count})</button>`).join('')}</div>
<h3>Clusters</h3>
${filteredClusters().map((c,i)=>{const col=CAT_COLORS[c.category]||C[i%C.length];
return`<div class="cl-card${selCluster===c.cluster_id?' sel':''}" data-cl="${c.cluster_id}">
<div class="nm" style="color:${col}">${esc(c.label)}</div>
<div class="mt">${c.item_count} items · Score:${c.avg_score} · Impact:${c.impact_score} · Madurez:${c.horizon_score} <span class="badge b-${c.relevance||'media'}">${c.relevance}</span></div>
<div class="tg">${(c.keywords||[]).slice(0,4).map(k=>`<span>${esc(k)}</span>`).join('')}</div>
${c.summary?`<div style="color:var(--muted);font-size:.75em;margin-top:4px">${esc(c.summary).slice(0,120)}</div>`:''}</div>`}).join('')}</div>`}

function insightsHTML(){
const ins=(D.insights||[]).map(i=>`<li>${esc(i)}</li>`).join('');
const recs=(D.recommendations||[]).map(r=>`<li>${esc(r)}</li>`).join('');
const risks=(D.risk_signals||[]).map(r=>`<li>${esc(r)}</li>`).join('');
if(!ins&&!recs&&!risks)return'';
return`<div class="info-panel">
${ins?`<h3>💡 Insights</h3><ul style="list-style:none;padding:0">${ins}</ul>`:''}
${recs?`<h3>🎯 Recomendaciones</h3><ul style="list-style:none;padding:0">${recs}</ul>`:''}
${risks?`<h3>⚠️ Señales de Riesgo</h3><ul class="risk" style="list-style:none;padding:0">${risks}</ul>`:''}
</div>`}

function footerHTML(){return`<div class="footer">⚠️ Aproximación para exploración estratégica. No reemplaza análisis experto. Scores generados por IA.</div>`}

function setupEvents(){
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.v;render()});
document.querySelectorAll('[data-ft]').forEach(b=>b.onclick=()=>{if(b.dataset.ft==='news')showNews=!showNews;else showPapers=!showPapers;render()});
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selCategory=b.dataset.cat||null;selCluster=null;render()});
document.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>{selCluster=selCluster===b.dataset.cl?null:b.dataset.cl;render()})}

function filteredClusters(){return D.clusters.filter(c=>!selCategory||c.category===selCategory)}
function filteredArticles(){
let a=D.articles;
if(!showNews)a=a.filter(x=>x.source_type!=='news');
if(!showPapers)a=a.filter(x=>x.source_type!=='paper');
if(selCluster)a=a.filter(x=>x.cluster_id===selCluster);
else if(selCategory){const ids=new Set(filteredClusters().map(c=>c.cluster_id));a=a.filter(x=>ids.has(x.cluster_id)||x.cluster_id==='unclustered')}
return a}

function renderView(){
if(view==='overview')renderOverview();
else if(view==='embedding')renderEmbed();
else if(view==='impact')renderImpact();
else if(view==='hype')renderHype();
else if(view==='table')renderTable();
else if(view==='method')renderMethod()}

// ── OVERVIEW (robust) ──
function renderOverview(){
const el=document.getElementById('chart');
const arts=filteredArticles();
const scores=arts.map(a=>a.relevance_score||0);
const newsCount=arts.filter(a=>a.source_type==='news').length;
const paperCount=arts.filter(a=>a.source_type==='paper').length;
const avgScore=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;
const topScore=Math.max(...scores,0);
const cls=filteredClusters();

// Timeline data: group by month
const byMonth={};arts.forEach(a=>{const d=(a.published_at||'').slice(0,7);if(d)byMonth[d]=(byMonth[d]||0)+1});
const months=Object.keys(byMonth).sort();

// Per-cluster timeline
const clTimelines={};cls.forEach(c=>{const ct={};
D.articles.filter(a=>a.cluster_id===c.cluster_id).forEach(a=>{const d=(a.published_at||'').slice(0,7);if(d)ct[d]=(ct[d]||0)+1});
clTimelines[c.cluster_id]={data:ct,label:c.label,color:CAT_COLORS[c.category]||'#8b949e'}});

// Source distribution
const bySrc={};arts.forEach(a=>{const s=a.source_id||'unknown';bySrc[s]=(bySrc[s]||0)+1});
const topSources=Object.entries(bySrc).sort((a,b)=>b[1]-a[1]).slice(0,8);

// Category distribution
const byCat={};cls.forEach(c=>{byCat[c.category||'Otros']=(byCat[c.category||'Otros']||0)+c.item_count});

// Source avg score
const srcScores={};const srcCounts={};
arts.forEach(a=>{const s=a.source_id||'unknown';srcScores[s]=(srcScores[s]||0)+(a.relevance_score||0);srcCounts[s]=(srcCounts[s]||0)+1});
const srcAvg=Object.entries(srcScores).map(([s,t])=>({src:s,avg:Math.round(t/srcCounts[s]),count:srcCounts[s]})).filter(s=>s.count>=2).sort((a,b)=>b.avg-a.avg).slice(0,10);

el.innerHTML=`
<div class="grid3" style="margin-bottom:16px">
<div class="card"><div class="kpi">${arts.length}</div><div class="kpi-label">Artículos analizados</div></div>
<div class="card"><div class="kpi">${avgScore}</div><div class="kpi-label">Score promedio</div></div>
<div class="card"><div class="kpi">${cls.length}</div><div class="kpi-label">Clusters identificados</div></div>
<div class="card"><div class="kpi">${newsCount}</div><div class="kpi-label">📰 Noticias</div></div>
<div class="card"><div class="kpi">${paperCount}</div><div class="kpi-label">📄 Papers</div></div>
<div class="card"><div class="kpi">${D.articles.filter(a=>a.cluster_id==='unclustered').length}</div><div class="kpi-label">Sin cluster</div></div>
</div>

<div class="grid2">
<div class="card"><h4>📈 Artículos por mes</h4><div id="ov-timeline" style="height:220px"></div></div>
<div class="card"><h4>📊 Distribución de scores</h4><div id="ov-scores" style="height:220px"></div></div>
</div>

<div class="grid2" style="margin-top:16px">
<div class="card"><h4>🏷️ Artículos por categoría</h4><div id="ov-cats" style="height:220px"></div></div>
<div class="card"><h4>📰 Artículos por fuente (top 8)</h4><div id="ov-sources" style="height:220px"></div></div>
</div>

<div class="grid2" style="margin-top:16px">
<div class="card"><h4>⭐ Score promedio por fuente (min 2 artículos)</h4><div id="ov-src-score" style="height:250px"></div></div>
<div class="card"><h4>📉 Evolución por cluster</h4><div id="ov-cl-timeline" style="height:250px"></div></div>
</div>

<div style="margin-top:16px"><h4 style="color:#fff;margin-bottom:10px">🧩 Resumen de Clusters</h4>
<table><thead><tr><th>Cluster</th><th>Cat</th><th>Items</th><th>Avg Score</th><th>Impact</th><th>Madurez</th><th>Relevancia</th></tr></thead>
<tbody>${cls.map(c=>`<tr>
<td style="color:${CAT_COLORS[c.category]||'var(--muted)'};font-weight:600;font-size:.8em">${esc(c.label.replace(/\[.*?\]\s*/,''))}</td>
<td style="font-size:.75em">${c.category||''}</td>
<td>${c.item_count}</td><td>${c.avg_score}</td><td>${c.impact_score}</td><td>${c.horizon_score}</td>
<td><span class="badge b-${c.relevance||'media'}">${c.relevance}</span></td></tr>`).join('')}
</tbody></table></div>`;

// Render charts
Plotly.newPlot('ov-timeline',[{x:months,y:months.map(m=>byMonth[m]),type:'bar',marker:{color:'var(--accent)',opacity:.7}}],
{paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{color:'var(--text)',size:10},xaxis:{gridcolor:'var(--border)'},yaxis:{gridcolor:'var(--border)'},margin:{l:35,r:10,t:5,b:30}},{responsive:true});

Plotly.newPlot('ov-scores',[{x:scores,type:'histogram',marker:{color:'var(--accent)',opacity:.7},xbins:{start:40,end:100,size:5}}],
{paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{color:'var(--text)',size:10},xaxis:{title:'Score',gridcolor:'var(--border)'},yaxis:{gridcolor:'var(--border)'},margin:{l:35,r:10,t:5,b:35}},{responsive:true});

const catNames=Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);
Plotly.newPlot('ov-cats',[{y:catNames,x:catNames.map(c=>byCat[c]),type:'bar',orientation:'h',
marker:{color:catNames.map(c=>CAT_COLORS[c]||'#8b949e'),opacity:.85}}],
{paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{color:'var(--text)',size:10},xaxis:{gridcolor:'var(--border)'},yaxis:{autorange:'reversed'},margin:{l:130,r:10,t:5,b:30}},{responsive:true});

Plotly.newPlot('ov-sources',[{y:topSources.map(s=>s[0]),x:topSources.map(s=>s[1]),type:'bar',orientation:'h',marker:{color:'var(--accent)',opacity:.7}}],
{paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{color:'var(--text)',size:10},xaxis:{gridcolor:'var(--border)'},yaxis:{autorange:'reversed'},margin:{l:120,r:10,t:5,b:30}},{responsive:true});

// Score promedio por fuente
Plotly.newPlot('ov-src-score',[{y:srcAvg.map(s=>s.src),x:srcAvg.map(s=>s.avg),type:'bar',orientation:'h',
text:srcAvg.map(s=>`${s.avg} (${s.count} arts)`),textposition:'outside',textfont:{size:9,color:'var(--text)'},
marker:{color:srcAvg.map(s=>s.avg>=70?'var(--green)':s.avg>=55?'var(--yellow)':'var(--muted)'),opacity:.85}}],
{paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{color:'var(--text)',size:10},
xaxis:{title:'Avg Score',gridcolor:'var(--border)',range:[0,Math.max(...srcAvg.map(s=>s.avg),80)+15]},
yaxis:{autorange:'reversed'},margin:{l:120,r:50,t:5,b:35}},{responsive:true});

// Per-cluster timeline
const clTraces=Object.entries(clTimelines).map(([cid,ct])=>({
x:months,y:months.map(m=>ct.data[m]||0),name:ct.label.replace(/\[.*?\]\s*/,'').slice(0,30),
type:'scatter',mode:'lines+markers',line:{color:ct.color,width:2},marker:{size:4}}));
Plotly.newPlot('ov-cl-timeline',clTraces,
{paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{color:'var(--text)',size:10},
xaxis:{gridcolor:'var(--border)'},yaxis:{title:'# artículos',gridcolor:'var(--border)'},
margin:{l:40,r:10,t:5,b:30},legend:{bgcolor:'transparent',font:{size:9}}},{responsive:true});
}

// ── EMBEDDING MAP (colored labels) ──
function renderEmbed(){
const el=document.getElementById('chart');el.style.height='600px';
const traces=[];const arts=filteredArticles();
const cmap={};D.clusters.forEach(c=>cmap[c.cluster_id]={col:CAT_COLORS[c.category]||'#8b949e',label:c.label,cat:c.category});

// Super-cluster hulls
if(!selCluster)(D.super_clusters||[]).forEach(sc=>{
if(selCategory&&sc.category!==selCategory)return;
const col=CAT_COLORS[sc.category]||'#8b949e';
if(sc.hull_polygon&&sc.hull_polygon.length>2){
const p=[...sc.hull_polygon,sc.hull_polygon[0]];
traces.push({x:p.map(v=>v[0]),y:p.map(v=>v[1]),mode:'lines',fill:'toself',fillcolor:col+'10',line:{color:col,width:2,dash:'dash'},name:sc.category,showlegend:false,hoverinfo:'skip'})}});

// Sub-cluster hulls
filteredClusters().forEach(c=>{
if(selCluster&&c.cluster_id!==selCluster)return;
const col=cmap[c.cluster_id]?.col||'#8b949e';
if(c.hull_polygon&&c.hull_polygon.length>2){
const p=[...c.hull_polygon,c.hull_polygon[0]];
traces.push({x:p.map(v=>v[0]),y:p.map(v=>v[1]),mode:'lines',fill:'toself',fillcolor:col+'15',line:{color:col,width:1,dash:'dot'},showlegend:false,hoverinfo:'skip'})}});

// Articles
const newsA=arts.filter(a=>a.source_type==='news');
const paperA=arts.filter(a=>a.source_type==='paper');
if(showNews&&newsA.length)traces.push({x:newsA.map(a=>a.x_embed),y:newsA.map(a=>a.y_embed),
text:newsA.map(a=>`<b>📰 ${esc(a.title.slice(0,55))}</b><br>Score:${a.relevance_score} | ${a.source_id}`),
mode:'markers',type:'scattergl',marker:{size:6,color:newsA.map(a=>cmap[a.cluster_id]?.col||'#555'),opacity:.7,symbol:'circle'},
name:'📰 Noticias',hovertemplate:'%{text}<extra></extra>'});
if(showPapers&&paperA.length)traces.push({x:paperA.map(a=>a.x_embed),y:paperA.map(a=>a.y_embed),
text:paperA.map(a=>`<b>📄 ${esc(a.title.slice(0,55))}</b><br>Score:${a.relevance_score} | ${a.source_id}`),
mode:'markers',type:'scattergl',marker:{size:8,color:paperA.map(a=>cmap[a.cluster_id]?.col||'#555'),opacity:.8,symbol:'diamond'},
name:'📄 Papers',hovertemplate:'%{text}<extra></extra>'});

// Centroids with COLORED labels (not white)
const cls=filteredClusters();
traces.push({x:cls.map(c=>c.x_embed),y:cls.map(c=>c.y_embed),
text:cls.map(c=>c.label.replace(/\[.*?\]\s*/,'').slice(0,30)),
mode:'markers+text',textposition:cls.map((_,i)=>['top center','bottom center','top right','bottom right','top left'][i%5]),
textfont:{size:9,color:cls.map(c=>CAT_COLORS[c.category]||'#8b949e')},
marker:{size:16,color:cls.map(c=>CAT_COLORS[c.category]||'#8b949e'),symbol:'star',line:{width:2,color:'#000'}},
showlegend:false,hovertemplate:cls.map(c=>`<b>${esc(c.label)}</b><br>${c.item_count} items<br>Impact:${c.impact_score}<extra></extra>`)});

Plotly.newPlot('chart',traces,{paper_bgcolor:'var(--bg)',plot_bgcolor:'var(--bg)',font:{color:'var(--text)',size:10},
xaxis:{showgrid:false,zeroline:false,showticklabels:false},yaxis:{showgrid:false,zeroline:false,showticklabels:false},
margin:{l:20,r:20,t:10,b:20},legend:{bgcolor:'transparent',font:{size:9}},hovermode:'closest'},{responsive:true})}

// ── IMPACT (no text cut, jitter, maturity info) ──
function renderImpact(){
const cls=filteredClusters();
const stageNames={0.1:'Innovation Trigger',0.2:'Early Stage',0.3:'Peak of Expectations',0.5:'Trough of Disillusionment',0.7:'Slope of Enlightenment',0.9:'Plateau of Productivity'};
const getStage=h=>{let b='',bd=99;for(const[k,v]of Object.entries(stageNames)){const d=Math.abs(h-parseFloat(k));if(d<bd){bd=d;b=v}}return b};
// Jitter
const pts=cls.map((c,i)=>({x:c.impact_score+(i%3-1)*2.5,y:c.horizon_score+(Math.floor(i/3)%3-1)*0.035}));
Plotly.newPlot('chart',[{x:pts.map(p=>p.x),y:pts.map(p=>p.y),
text:cls.map(c=>`<b>${esc(c.label)}</b><br>${c.item_count} items · Avg:${c.avg_score}<br>Impact: ${c.impact_score}<br>Madurez: ${c.horizon_score} (${getStage(c.horizon_score)})<br>Relevancia: ${c.relevance}`),
mode:'markers',textfont:{size:8},
marker:{size:cls.map(c=>Math.max(25,Math.sqrt(c.item_count)*14)),color:cls.map(c=>CAT_COLORS[c.category]||'#8b949e'),opacity:.85,line:{width:2,color:'#fff'}},
hovertemplate:'%{text}<extra></extra>',showlegend:false}],
{paper_bgcolor:'var(--bg)',plot_bgcolor:'var(--bg)',font:{color:'var(--text)'},
xaxis:{title:'Impacto (0-100)',gridcolor:'var(--border)',range:[0,105]},
yaxis:{title:'Madurez',gridcolor:'var(--border)',range:[-0.1,1.15],tickvals:[0.1,0.3,0.5,0.7,0.9],ticktext:['Trigger','Peak','Trough','Slope','Plateau']},
margin:{l:80,r:20,t:20,b:50},hovermode:'closest',
shapes:[{type:'line',x0:50,x1:50,y0:0,y1:1,line:{color:'var(--border)',dash:'dash'}},{type:'line',x0:0,x1:100,y0:.5,y1:.5,line:{color:'var(--border)',dash:'dash'}}],
annotations:cls.map((c,i)=>({x:pts[i].x,y:pts[i].y-0.07,text:esc(c.label.replace(/\[.*?\]\s*/,'')),showarrow:false,
font:{color:CAT_COLORS[c.category]||'var(--muted)',size:8}})).concat([
{x:80,y:.12,text:'Alto Impacto · Emergente',showarrow:false,font:{color:'var(--green)',size:9,opacity:.5}},
{x:80,y:.88,text:'Alto Impacto · Maduro',showarrow:false,font:{color:'var(--accent)',size:9}},
{x:20,y:.12,text:'Bajo Impacto · Emergente',showarrow:false,font:{color:'var(--muted)',size:8}}])},{responsive:true})}

// ── HYPE CYCLE (no overlap labels) ──
function renderHype(){
const stg={innovation_trigger:{x:80,y:250},peak_of_inflated_expectations:{x:200,y:60},trough_of_disillusionment:{x:350,y:280},slope_of_enlightenment:{x:500,y:160},plateau_of_productivity:{x:650,y:120}};
const sL=[['innovation_trigger','Innovation Trigger'],['peak_of_inflated_expectations','Peak'],['trough_of_disillusionment','Trough'],['slope_of_enlightenment','Slope'],['plateau_of_productivity','Plateau']];
let svg=`<svg viewBox="0 0 800 420" style="width:100%;max-width:850px">
<path d="M 40,300 C 80,300 120,50 200,50 C 280,50 300,310 350,310 C 400,310 450,150 500,150 C 550,150 600,120 700,120" fill="none" stroke="url(#hg)" stroke-width="3" opacity=".4"/>
<defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="var(--accent)"/><stop offset="100%" stop-color="var(--green)"/></linearGradient></defs>`;
sL.forEach(([k,l])=>{const s=stg[k];svg+=`<text x="${s.x}" y="360" fill="var(--muted)" font-size="9" text-anchor="middle">${l}</text>`});

// Place trends with vertical stacking to avoid overlap
const placed={};
(D.trends||[]).forEach((t,i)=>{const s=stg[t.maturity_stage];if(!s)return;
const col=CAT_COLORS[t.trend]||C[i%C.length];
const baseX=s.x,baseY=s.y;
// Stack vertically within same stage
const stageKey=t.maturity_stage;
placed[stageKey]=(placed[stageKey]||0);
const yOff=placed[stageKey]*35;
placed[stageKey]++;
const x=baseX,y=baseY-20+yOff;
const name=esc((t.trend||'').slice(0,28));
svg+=`<circle cx="${x}" cy="${y}" r="10" fill="${col}" opacity=".9"/>`;
svg+=`<text x="${x+14}" y="${y+4}" fill="${col}" font-size="10" font-weight="bold">${name}</text>`;
svg+=`<text x="${x+14}" y="${y+16}" fill="var(--muted)" font-size="8">m=${(t.momentum||0).toFixed(2)}</text>`});
svg+='</svg>';

const tbl=(D.trends||[]).map((t,i)=>{const col=CAT_COLORS[t.trend]||C[i%C.length];
return`<tr><td style="color:${col};font-weight:600">${esc(t.trend)}</td>
<td>${{creciente:'↑',estable:'→',decreciente:'↓'}[t.direction]||'•'} ${t.direction||''}</td>
<td><div style="background:var(--border);border-radius:3px;height:16px;width:100px"><div style="background:${col};border-radius:3px;height:16px;width:${(t.momentum||0)*100}px;font-size:.7em;color:#fff;text-align:center">${(t.momentum||0).toFixed(2)}</div></div></td>
<td style="font-size:.75em">${t.maturity_stage||''}</td>
<td style="font-size:.75em;color:var(--muted)">${esc(t.description||'')}</td></tr>`}).join('');
document.getElementById('chart').innerHTML=`<div style="text-align:center;padding:10px">${svg}</div>
<table style="margin-top:12px"><thead><tr><th>Tendencia</th><th>Dir</th><th>Momentum</th><th>Etapa</th><th>Detalle</th></tr></thead><tbody>${tbl}</tbody></table>`}

// ── TABLE ──
function renderTable(){
const arts=filteredArticles().sort((a,b)=>(b.relevance_score||0)-(a.relevance_score||0));
const cmap={};D.clusters.forEach(c=>cmap[c.cluster_id]={l:c.label,c:CAT_COLORS[c.category]||'var(--muted)'});
document.getElementById('chart').innerHTML=`<div style="margin-bottom:8px;color:var(--muted);font-size:.8em">${arts.length} artículos</div>
<div style="max-height:600px;overflow-y:auto"><table>
<thead><tr><th>#</th><th>Score</th><th>Tipo</th><th>Cluster</th><th>Título</th><th>Fuente</th></tr></thead>
<tbody>${arts.map((a,i)=>{const ci=cmap[a.cluster_id]||{l:'unclustered',c:'var(--muted)'};
return`<tr><td>${i+1}</td>
<td style="font-weight:600;color:${a.relevance_score>=70?'var(--green)':a.relevance_score>=50?'var(--yellow)':'var(--muted)'}">${a.relevance_score}</td>
<td>${a.source_type==='paper'?'📄':'📰'}</td>
<td style="color:${ci.c};font-size:.78em">${esc(ci.l.replace(/\[.*?\]\s*/,'')).slice(0,35)}</td>
<td><a href="${a.url}" target="_blank">${esc(a.title).slice(0,80)}</a></td>
<td style="font-size:.75em;color:var(--muted)">${a.source_id}</td></tr>`}).join('')}
</tbody></table></div>`}

// ── METHODOLOGY ──
function renderMethod(){
const m=D.meta?.methodology||{};const cfg=D.meta?.config||{};
document.getElementById('chart').innerHTML=`<div style="padding:20px">
<h2 style="color:#fff;margin-bottom:16px">ⓘ Metodología del Análisis</h2>
<dl class="method-box">
<dt>Embeddings</dt><dd>${esc(m.embeddings||'N/A')}</dd>
<dt>Clustering</dt><dd>${esc(m.clustering||'N/A')}</dd>
<dt>Remoción de outliers</dt><dd>${esc(m.outlier_removal||'N/A')}</dd>
<dt>Etiquetado de clusters</dt><dd>${esc(m.labeling||'N/A')}</dd>
<dt>Momentum (fórmula)</dt><dd><code>${esc(m.momentum||'N/A')}</code></dd>
<dt>Maturity Stage (heurística)</dt><dd>${esc(m.maturity_stage||'N/A')}</dd>
<dt>Impact Score (fórmula)</dt><dd><code>${esc(m.impact_score||'N/A')}</code></dd>
<dt>Horizon Score</dt><dd>${esc(m.horizon_score||'N/A')}</dd>
</dl>
<dl class="method-box">
<dt>K óptimo (referencia)</dt><dd>${cfg.optimal_k||'?'} (Silhouette: ${cfg.silhouette_score||'?'})</dd>
<dt>Modelo embeddings</dt><dd>${cfg.embedding_model||'?'}</dd>
<dt>Outlier threshold</dt><dd>${cfg.outlier_threshold||'HDBSCAN noise detection'}</dd>
</dl>
<p style="color:var(--muted);font-size:.8em;margin-top:16px">
⚠️ Scores generados por IA (Claude Haiku via Amazon Bedrock). Clustering algorítmico (HDBSCAN sobre embeddings semánticos + PCA). Etiquetado por LLM. Herramienta de exploración, no reemplaza análisis experto.</p></div>`}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
boot();
</script>
