# ─────────────────────────────────────────────────────────────────────
# Trend Map Configuration
# ─────────────────────────────────────────────────────────────────────

# Embeddings (Amazon Bedrock)
embeddings:
  model_id: "amazon.titan-embed-text-v2:0"
  region: "us-east-1"
  max_text_length: 2000
  batch_size: 25
  cache_file: "data/embeddings_cache.jsonl"

# UMAP parameters (spread controls cluster separation)
umap:
  n_neighbors: 10
  min_dist: 0.3
  n_components: 2
  metric: "cosine"
  random_state: 42
  spread: 2.0

# Impact score weights (must sum to 1.0)
impact:
  weight_score: 0.45      # avg relevance_score
  weight_volume: 0.25     # normalized article count
  weight_recency: 0.20    # median recency (days since publish)
  weight_signals: 0.10    # extra signals (risk_signals, etc.)

# Horizon/Maturity mapping (ordinal 0..1)
horizon:
  innovation_trigger: 0.1
  peak_of_inflated_expectations: 0.3
  trough_of_disillusionment: 0.5
  slope_of_enlightenment: 0.7
  plateau_of_productivity: 0.9

# Hull parameters
hull:
  alpha: 0.5              # alpha shape parameter (lower = tighter)
  min_points_alpha: 10    # min points for alpha shape
  min_points_convex: 3    # min points for convex hull
  circle_radius_factor: 0.05  # radius for <3 points (fraction of plot range)

# Data paths (relative to news_radar_mvp/ parent, i.e. workspace root)
paths:
  articles: "../out/articles_news_all.jsonl"
  papers: "../out/articles_papers.jsonl"
  powerbi: "../out/analysis_combined/powerbi_data.json"
  llm_analysis: "../out/analysis_combined/llm_analysis.json"
  output_dir: "trendmap/data"
