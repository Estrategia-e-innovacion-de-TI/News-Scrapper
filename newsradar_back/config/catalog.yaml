defaults:
  user_agent: "NewsRadarMVP/0.1 (+contact: security-research@yourorg.com)"
  timeout_seconds: 25
  max_retries: 2
  retry_backoff_seconds: 1.7
  rate_limit_rps: 1.0
  max_items_per_source: 30
  min_text_chars: 800
