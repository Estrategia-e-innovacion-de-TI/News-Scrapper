[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsradar-back"
version = "0.1.0"
description = "News Radar Backend API — FastAPI REST endpoints for ARAS, Riesgos, and Vigilancia"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "News Radar Team"}]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "boto3>=1.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "trafilatura>=1.8.0",
    "readability-lxml>=0.8.0",
    "python-dateutil>=2.8.0",
    "googlenewsdecoder>=0.1.0",
    "openpyxl>=3.1.0",
    "langgraph>=0.2.0",
    "scikit-learn>=1.4.0",
    "umap-learn>=0.5.0",
    "hdbscan>=0.8.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["newsradar_api*"]
