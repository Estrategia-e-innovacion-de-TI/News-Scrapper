version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: newsradar
      POSTGRES_PASSWORD: newsradar
      POSTGRES_DB: newsradar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./newsradar_back
    environment:
      DATABASE_URL: postgresql+asyncpg://newsradar:newsradar@postgres:5432/newsradar
      NEWSRADAR_SMCP_URL: http://smcp:8080
      AIAGENT_URL: http://aiagent:8090
      BACKEND_URL: http://backend:8000
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-3-haiku-20240307-v1:0}
      NEWSRADAR_SNAPSHOT_LLM_MODE: ${NEWSRADAR_SNAPSHOT_LLM_MODE:-auto}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./newsradar_back
    command: ["python", "-m", "newsradar_api.worker.runner"]
    environment:
      DATABASE_URL: postgresql+asyncpg://newsradar:newsradar@postgres:5432/newsradar
      NEWSRADAR_SMCP_URL: http://smcp:8080
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-3-haiku-20240307-v1:0}
      NEWSRADAR_SNAPSHOT_LLM_MODE: ${NEWSRADAR_SNAPSHOT_LLM_MODE:-auto}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
    depends_on:
      - postgres
      - backend
      - smcp

  smcp:
    build:
      context: ./newsradar_smcp
    environment:
      NEWSRADAR_BACK_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8080:8080"

  aiagent:
    build:
      context: ./newsradar_aiagent
    environment:
      NEWSRADAR_SMCP_URL: http://smcp:8080
      NEWSRADAR_BACK_URL: http://backend:8000
    depends_on:
      - smcp
      - backend
    ports:
      - "8090:8090"

  frontend:
    build:
      context: ./newsradar_front
    depends_on:
      - backend
    ports:
      - "4200:4200"

volumes:
  pgdata:
