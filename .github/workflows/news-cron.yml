name: Fetch News (cron)

on:
  schedule:
    # Hoy 22-08 a las 20:35 UTC (3:35 p.m. Bogotá). Se repetirá cada año si no lo quitas.
    - cron: "35 20 22 8 *"
  workflow_dispatch: {}


permissions:
  contents: write            # necesario para que el job pueda commitear resultados

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetcher
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          python news_fetch.py

      - name: Commit & push if changed
        run: |
          if [[ `git status --porcelain` ]]; then
            git add -A
            git commit -m "chore: update news $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "Sin cambios que commitear."
          fi
