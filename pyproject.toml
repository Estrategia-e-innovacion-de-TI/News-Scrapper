[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-radar-mvp"
version = "0.1.0"
description = "MVP for news extraction from multiple sources using LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "News Radar Team"}]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "readability-lxml>=0.8.0",
    "pypdf2>=3.0.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "pyyaml>=6.0.0",
    "lxml>=5.0.0",
    "openpyxl>=3.1.0",
    "scikit-learn>=1.4.0",
    "jsonschema>=4.21.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.100.0",
]
all = ["news-radar-mvp[browser,dev]"]

[project.scripts]
news-radar = "extractor.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["extractor*"]

# ── Monorepo workspace ──────────────────────────────────────────────
# Each component lives in its own directory with its own pyproject.toml.
# Install components in editable mode:
#   pip install -e newsradar_smcp/
#   pip install -e newsradar_aiagent/
#   pip install -e newsradar_back/
[tool.newsradar]
workspace = [
    "newsradar_smcp",
    "newsradar_aiagent",
    "newsradar_back",
    "newsradar_front",
]
