flow: tech_watch
description: Vigilancia tecnologica batch sobre noticias, papers y patentes.
default_window_months: 6
sources:
  news:
    schedule: weekly
    focus: vigilancia_news
    enabled: true
  google_news:
    schedule: weekly
    provider: google_news
    enabled: true
    max_queries: 5
    max_items_per_query: 50
    max_items_total: 250
  arxiv_papers:
    schedule: weekly
    provider: arxiv
    enabled: true
    max_terms: 10
    max_items_per_term: 6
  papers:
    schedule: monthly
    mode: papers
    enabled: true
  patents:
    schedule: bimonthly
    mode: patents
    enabled: true
scoring:
  classifier_mode: rules
  llm_prompt: rerank_vigilancia.yaml
  min_relevance: 45
