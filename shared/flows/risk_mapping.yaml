flow: risk_mapping
description: Radar batch de riesgos emergentes sobre noticias y fuentes institucionales especializadas.
default_window_months: 6
sources:
  risk_news:
    schedule: weekly
    focus: riesgos_news
    enabled: true
  google_news:
    schedule: weekly
    provider: google_news
    enabled: true
    max_queries: 8
    max_items_per_query: 60
    max_items_total: 360
  institutional_reports:
    schedule: bimonthly
    type: institutional_report
    enabled: true
    catalog:
      - world_economic_forum
      - world_bank
      - marsh
      - zurich
      - allianz
      - aon
scoring:
  classifier_mode: llm
  llm_prompt: rerank_riesgo.yaml
  min_relevance: 40
analytics:
  analysis_engine: build_riskmap_adapter
  cluster_method: bedrock_embeddings_hdbscan_with_fallback
  snapshot_llm_prompt: snapshot_riskmap.yaml
  snapshot_llm_enabled: false
  persist_snapshots: true
  min_relevance_for_clustering: 40
  weak_signal_max_documents: 4
  weak_signal_novelty_min: 55
  weak_signal_momentum_min: 40
  weak_signal_avg_score_min: 68
  duplicate_signature_terms: 12
  representation_text_chars: 3200
  embedding_text_chars: 2200
  lineage_similarity_threshold: 0.52
  reuse_previous_cluster_ids: true
  full_reclustering_policy: full_recluster_each_snapshot_with_lineage_reuse
