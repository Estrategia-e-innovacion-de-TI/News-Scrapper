# ── Search providers (papers, repos, patents) ────────────────────────

papers:
  terms:
    - "operational risk machine learning"
    - "fraud detection deep learning"
    - "AML anti money laundering NLP"
    - "cybersecurity threat intelligence"
    - "LLM security vulnerabilities"
    - "quantum computing finance"
    - "blockchain DeFi risk"
    - "generative AI banking"
  filters:
    require_keywords_any: ["risk", "fraud", "AML", "cyber", "threat", "quantum", "blockchain", "LLM", "AI"]

repos:
  terms:
    - "langgraph news extraction"
    - "fraud-detection-ml"
    - "threat-intelligence-platform"
    - "AML-compliance"
    - "quantum-computing-finance"
    - "llm-agents"
    - "open-banking-api"
  filters:
    min_stars: 10
    updated_within_days: 90

patents:
  terms:
    - "fraud detection neural network"
    - "anti money laundering artificial intelligence"
    - "blockchain financial transaction"
    - "quantum resistant encryption"
    - "biometric payment authentication"
    - "digital currency central bank"
    - "credit scoring machine learning"
    - "ransomware detection system"
  filters:
    date_window_months: 1
