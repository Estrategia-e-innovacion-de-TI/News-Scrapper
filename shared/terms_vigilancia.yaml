# ─────────────────────────────────────────────────────────────────────
# Términos de vigilancia tecnológica por grupo temático.
#
# Cada grupo de primer nivel es un query_group al que los suscriptores
# pueden suscribirse.  Los términos se usan para búsqueda en Google News,
# RSS feeds, y search providers (ArXiv, GitHub, Patents).
# ─────────────────────────────────────────────────────────────────────

