
timezone: "America/Bogota"   # opcional (default: UTC)

date_window:
  # --- OPCIÓN A: Últimos 7 días (rolling, incluye hoy) ---
  #mode: "relative"
  #unit: "days"          # days | weeks | months
  #amount: 7
  #include_today: true

  # --- OPCIÓN B: Semana calendario anterior (lun–dom) ---
  # mode: "calendar_week"
  # which: "previous"   # previous = semana pasada completa | current = semana en curso
  # week_start: "mon"   # mon = lunes | sun = domingo

  # --- OPCIÓN C: Mes calendario anterior ---
  # mode: "calendar_month"
  # which: "previous"   # previous = mes pasado completo | current = mes actual hasta hoy

  # --- OPCIÓN D: Último mes rolling (aprox 30 días) ---
  mode: "relative"
  unit: "months"
  amount: 1
  include_today: true

  # --- OPCIÓN E: Rango fijo ---
  # mode: "fixed"
  # from: "2025-08-01"
  # to:   "2025-08-25"

# Si se especifican dominios, se limita la búsqueda a estos (opcional)
domains:

# Idiomas por defecto si la fila del Excel no define 'Idioma'
languages: ["es"]

# Salida
output:
  folder: "data"          # (se mantiene para CSV/JSONL si los usas)
  csv_name: "news.csv"
  jsonl_name: "news.jsonl"
  excel:                  # 👇 NUEVA sección para Excel por corrida
    folder: "data/noticias"
    #filename_template: "{fecha_consulta_hasta}.xlsx"  # Tokens válidos: {fecha_consulta_desde}, {fecha_consulta_hasta}, {run_timestamp}
    filename_template: "{run_timestamp}.xlsx"

# Límites
limits:
  per_query_page_size: 50   # <=100 por NewsAPI
  per_query_page_size: 50   # <=100 por NewsAPI
